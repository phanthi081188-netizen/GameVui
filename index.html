<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>🚀 Đua Tên Lửa Toán Học</title>
<style>
:root {
  --bg: #0d0d1a;
  --bg2: #151528;
  --border: #2a2a4a;
  --text: #f0f0ff;
  --text2: #9090bb;
  --blue: #2255cc;
  --blue2: #4488ff;
  --green: #33bb66;
  --red: #ee4444;
  --orange: #e07020;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); overscroll-behavior: none; }
body { display: flex; justify-content: center; }
#app { width: 100%; max-width: 520px; padding: 16px 14px 24px; min-height: 100vh; }
.hidden { display: none !important; }

/* ── LOBBY ── */
#lobby { padding-top: 8px; }
.logo { text-align: center; margin-bottom: 4px; }
.logo h1 { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
.logo p  { font-size: 13px; color: var(--text2); margin-top: 3px; }

.mode-cards { display: flex; gap: 10px; margin: 18px 0 16px; }
.mode-card {
  flex: 1; background: var(--bg2); border: 1.5px solid var(--border);
  border-radius: var(--radius); padding: 14px 10px; cursor: pointer;
  text-align: center; transition: border-color .15s, transform .1s;
  -webkit-user-select: none; user-select: none;
}
.mode-card.active { border-color: var(--blue2); background: rgba(68,136,255,.08); }
.mode-card .icon { font-size: 32px; margin-bottom: 6px; }
.mode-card h3 { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
.mode-card p  { font-size: 11px; color: var(--text2); line-height: 1.4; }

.setup-section { margin-bottom: 14px; }
.player-cards { display: flex; gap: 10px; }
.player-card {
  flex: 1; background: var(--bg2); border: .5px solid var(--border);
  border-radius: var(--radius); padding: 12px 10px;
}
.player-card h4 { font-size: 11px; font-weight: 600; color: var(--text2); margin-bottom: 8px; text-transform: uppercase; letter-spacing: .4px; }
.avatar-row { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px; }
.av-btn {
  font-size: 20px; background: none; border: 1.5px solid transparent;
  border-radius: 8px; cursor: pointer; padding: 3px 5px; line-height: 1;
  transition: border-color .1s;
}
.av-btn.sel { border-color: var(--blue2); background: rgba(68,136,255,.15); }
.name-input {
  width: 100%; height: 36px; font-size: 14px; padding: 0 10px;
  border: 1px solid var(--border); border-radius: 8px;
  background: var(--bg); color: var(--text); outline: none;
}
.name-input:focus { border-color: var(--blue2); }
.ai-badge {
  text-align: center; padding: 10px 4px;
  font-size: 12px; color: var(--text2); line-height: 1.5;
}
.ai-badge .big { font-size: 36px; display: block; margin-bottom: 4px; }

.diff-label { font-size: 11px; color: var(--text2); margin: 10px 0 5px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.diff-row { display: flex; gap: 6px; }
.diff-btn {
  flex: 1; padding: 7px 4px; font-size: 12px; font-weight: 600;
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  background: var(--bg); color: var(--text2); transition: all .15s;
}
.diff-btn.sel { background: var(--blue); color: white; border-color: var(--blue); }

.op-section { margin-bottom: 14px; }
.op-section .section-label { font-size: 11px; color: var(--text2); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
.op-row { display: flex; gap: 6px; }
.op-toggle {
  flex: 1; padding: 8px 4px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
  background: var(--bg); color: var(--text2); transition: all .15s;
  text-align: center;
}
.op-toggle.on { background: var(--blue); color: white; border-color: var(--blue); }

.start-btn {
  width: 100%; padding: 15px; font-size: 17px; font-weight: 700;
  background: var(--blue); color: white; border: none;
  border-radius: var(--radius); cursor: pointer; transition: background .15s;
  letter-spacing: .3px;
}
.start-btn:active { background: #1a44bb; }

/* ── GAME ── */
#game-screen { padding-top: 4px; }
.top-bar { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.back-btn {
  background: var(--bg2); border: .5px solid var(--border); border-radius: 8px;
  color: var(--text2); font-size: 13px; padding: 6px 10px; cursor: pointer;
  white-space: nowrap;
}
.scorecards { display: flex; gap: 6px; flex: 1; }
.sc { flex: 1; background: var(--bg2); border: .5px solid var(--border); border-radius: 9px; padding: 6px 8px; text-align: center; }
.sc .lbl { font-size: 9px; color: var(--text2); margin-bottom: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sc .val { font-size: 17px; font-weight: 700; }

/* track */
.track-wrap { position: relative; height: 80px; border-radius: 10px; overflow: hidden; margin-bottom: 8px; border: .5px solid #1a1a3a; }
.track-canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.track-lbl { position: absolute; left: 10px; top: 8px; font-size: 11px; font-weight: 600; color: rgba(255,255,255,.55); z-index: 4; pointer-events: none; }
.flag-end { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-size: 22px; z-index: 4; }
.racer { position: absolute; top: 50%; transform: translateY(-50%); z-index: 5; transition: left .5s cubic-bezier(.34,1.3,.64,1); }

/* question */
#q-box {
  background: var(--bg2); border: .5px solid var(--border);
  border-radius: var(--radius); padding: 14px; margin-bottom: 0;
}
#timer-wrap { height: 5px; background: var(--border); border-radius: 3px; margin-bottom: 10px; overflow: hidden; }
#timer-bar { height: 100%; background: var(--blue2); border-radius: 3px; transition: width .1s linear, background .3s; }
#commentary { font-size: 12px; color: var(--text2); text-align: center; min-height: 18px; margin-bottom: 8px; font-style: italic; }
#q-text { font-size: clamp(26px, 7vw, 34px); font-weight: 700; text-align: center; letter-spacing: 2px; margin-bottom: 12px; }

/* 1P input */
#inp-1p { display: flex; gap: 8px; justify-content: center; }
#inp-1p input { width: 100px; height: 48px; font-size: 22px; font-weight: 700; text-align: center; border: 2px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); outline: none; }
#inp-1p input:focus { border-color: var(--blue2); }
#confirm-btn {
  height: 48px; padding: 0 20px; font-size: 15px; font-weight: 700;
  background: var(--blue); color: white; border: none; border-radius: 10px; cursor: pointer;
}
#confirm-btn:active { background: #1a44bb; }

/* 2P input */
#inp-2p { display: flex; gap: 10px; }
.p-box {
  flex: 1; background: var(--bg); border: .5px solid var(--border);
  border-radius: 10px; padding: 8px 10px; text-align: center;
}
.p-box label { font-size: 10px; font-weight: 700; display: block; margin-bottom: 5px; }
.p-box input { width: 80px; height: 42px; font-size: 20px; font-weight: 700; text-align: center; border: 2px solid var(--border); border-radius: 8px; background: var(--bg2); color: var(--text); outline: none; }

input.ok  { border-color: var(--green) !important; }
input.bad { border-color: var(--red)   !important; animation: shake .3s; }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

/* mobile number pad */
#numpad {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin-top: 12px;
}
.np-btn {
  padding: 14px; font-size: 20px; font-weight: 700;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 10px; cursor: pointer; color: var(--text);
  text-align: center; transition: background .1s;
  -webkit-user-select: none; user-select: none;
}
.np-btn:active { background: #2a2a4a; }
.np-btn.confirm { background: var(--blue); color: white; border-color: var(--blue); font-size: 16px; }
.np-btn.del { background: var(--bg2); font-size: 18px; }

.hint-2p { font-size: 10px; color: var(--text2); text-align: center; margin-top: 6px; }
#feedback { min-height: 20px; font-size: 13px; font-weight: 600; text-align: center; margin-top: 8px; }

/* particles */
.smoke { position: absolute; border-radius: 50%; pointer-events: none; z-index: 6; animation: puff .8s ease-out forwards; }
@keyframes puff { 0%{opacity:.7;transform:scale(.4) translate(0,0)} 100%{opacity:0;transform:scale(2.2) translate(-30px,var(--dy))} }
.boost { position: absolute; border-radius: 50%; pointer-events: none; z-index: 6; border: 2px solid rgba(120,210,255,.8); animation: ring .5s ease-out forwards; }
@keyframes ring { 0%{opacity:.9;transform:translate(-50%,-50%) scale(.3)} 100%{opacity:0;transform:translate(-50%,-50%) scale(2.2)} }

/* win */
#win-screen { text-align: center; padding: 2.5rem 1rem; background: var(--bg2); border: .5px solid var(--border); border-radius: 16px; }
#win-screen .trophy { font-size: 60px; margin-bottom: 12px; }
#win-screen h2 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
#win-screen p  { font-size: 14px; color: var(--text2); margin-bottom: 1.5rem; line-height: 1.6; white-space: pre-line; }
.win-btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.win-btn { padding: 12px 24px; font-size: 15px; font-weight: 700; background: var(--blue); color: white; border: none; border-radius: 10px; cursor: pointer; }
.win-btn.sec { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
</style>
</head>
<body>
<div id="app">

<!-- ═══ LOBBY ═══ -->
<div id="lobby">
  <div class="logo">
    <h1>🚀 Đua Tên Lửa</h1>
    <p>Toán học · Thi đấu tốc độ</p>
  </div>

  <div class="mode-cards">
    <div class="mode-card active" id="card-1p" onclick="selectMode('1p')">
      <div class="icon">🧑‍🚀🍠</div>
      <h3>vs Khoai Lang</h3>
      <p>Đấu AI ngớ ngẩn nhất vũ trụ</p>
    </div>
    <div class="mode-card" id="card-2p" onclick="selectMode('2p')">
      <div class="icon">🧑‍🚀🧑‍🚀</div>
      <h3>2 người chơi</h3>
      <p>Cùng 1 màn hình</p>
    </div>
  </div>

  <div id="setup-area"></div>

  <div class="op-section">
    <div class="section-label">Phép tính</div>
    <div class="op-row">
      <button class="op-toggle on" data-op="+">+ Cộng</button>
      <button class="op-toggle on" data-op="−">− Trừ</button>
      <button class="op-toggle" data-op="×">× Nhân</button>
      <button class="op-toggle" data-op="÷">÷ Chia</button>
    </div>
  </div>

  <button class="start-btn" onclick="launchGame()">Bắt đầu! 🚀</button>
</div>

<!-- ═══ GAME ═══ -->
<div id="game-screen" class="hidden">
  <div class="top-bar">
    <button class="back-btn" onclick="goLobby()">← Sảnh</button>
    <div class="scorecards">
      <div class="sc"><div class="lbl" id="sb1">Bạn</div><div class="val" id="s1">0</div></div>
      <div class="sc"><div class="lbl">Câu</div><div class="val" id="qn">1/10</div></div>
      <div class="sc"><div class="lbl" id="sb2">Khoai</div><div class="val" id="s2">0</div></div>
    </div>
  </div>

  <!-- Track 1 -->
  <div class="track-wrap" id="tr1">
    <canvas class="track-canvas" id="cv1"></canvas>
    <div class="track-lbl" id="tl1">🚀 Bạn</div>
    <div class="flag-end">🏁</div>
    <div class="racer" id="rc1" style="left:2%">
      <svg width="66" height="34" viewBox="0 0 66 34" xmlns="http://www.w3.org/2000/svg">
        <ellipse id="f1c" cx="6" cy="17" rx="6" ry="3.5" fill="#ff9900" opacity=".9"/>
        <ellipse id="f1h" cx="4" cy="17" rx="3.5" ry="2" fill="#ffee44" opacity=".85"/>
        <rect x="10" y="11" width="42" height="12" rx="6" fill="#1a4acc"/>
        <ellipse cx="42" cy="17" rx="8" ry="6.5" fill="#2255ee"/>
        <ellipse cx="44" cy="15" rx="4.5" ry="3.5" fill="#99ccff" opacity=".85"/>
        <ellipse cx="45" cy="14" rx="2.2" ry="1.8" fill="#ddeeff" opacity=".7"/>
        <path d="M49 11 L62 17 L49 23 Z" fill="#4488ff"/>
        <path d="M17 11 L11 4 L24 11 Z" fill="#1038aa"/>
        <path d="M17 23 L11 30 L24 23 Z" fill="#1038aa"/>
        <rect x="26" y="11" width="3" height="12" rx="1" fill="#88bbff" opacity=".5"/>
        <rect x="10" y="13" width="4" height="8" rx="2" fill="#0a2888"/>
      </svg>
    </div>
  </div>

  <!-- Track 2 -->
  <div class="track-wrap" id="tr2">
    <canvas class="track-canvas" id="cv2"></canvas>
    <div class="track-lbl" id="tl2">🍠 Khoai Lang</div>
    <div class="flag-end">🏁</div>
    <div class="racer" id="rc2" style="left:2%">
      <svg width="76" height="42" viewBox="0 0 76 42" xmlns="http://www.w3.org/2000/svg">
        <ellipse id="f2c" cx="7" cy="21" rx="8" ry="5" fill="#ff7700" opacity=".9"/>
        <ellipse id="f2h" cx="4" cy="21" rx="5" ry="3" fill="#ffdd33" opacity=".85"/>
        <ellipse cx="36" cy="21" rx="25" ry="13" fill="#c45e00"/>
        <ellipse cx="36" cy="21" rx="22" ry="11" fill="#e07020"/>
        <circle cx="26" cy="15" r="3.2" fill="#bf5800" opacity=".42"/>
        <circle cx="40" cy="29" r="2.8" fill="#bf5800" opacity=".38"/>
        <circle cx="32" cy="30" r="2.3" fill="#bf5800" opacity=".35"/>
        <circle cx="48" cy="16" r="2.5" fill="#bf5800" opacity=".35"/>
        <path d="M58 13 L72 21 L58 29 Z" fill="#f09040"/>
        <path d="M60 15 L70 21 L60 27 Z" fill="#f8b060"/>
        <path d="M20 9 L14 2 L30 9 Z" fill="#a04d00"/>
        <path d="M20 33 L14 40 L30 33 Z" fill="#a04d00"/>
        <ellipse cx="41" cy="21" rx="9" ry="8" fill="#fff7e0" opacity=".92"/>
        <ellipse cx="41" cy="21" rx="7" ry="6" fill="#ffe580"/>
        <circle cx="38" cy="19" r="2.1" fill="#fff"/>
        <circle cx="44" cy="19" r="2.1" fill="#fff"/>
        <circle cx="38.8" cy="19.5" r="1.05" fill="#222"/>
        <circle cx="44.8" cy="19.5" r="1.05" fill="#222"/>
        <circle cx="39.2" cy="19" r=".42" fill="white"/>
        <circle cx="45.2" cy="19" r=".42" fill="white"/>
        <path d="M37 24 Q41 27.5 45 24" stroke="#8B4513" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <ellipse cx="13" cy="21" rx="4" ry="7" fill="#a04d00"/>
        <ellipse cx="13" cy="21" rx="2.5" ry="5" fill="#7a3800"/>
      </svg>
    </div>
  </div>

  <!-- Question box -->
  <div id="q-box">
    <div id="timer-wrap"><div id="timer-bar" style="width:100%"></div></div>
    <div id="commentary">Sẵn sàng chưa? 🔥</div>
    <div id="q-text">? + ? = ?</div>
    <!-- 1P: numpad on mobile -->
    <div id="inp-1p">
      <input type="number" id="a1p" placeholder="?" autocomplete="off" inputmode="numeric"/>
      <button id="confirm-btn" onclick="sub1p()">OK ✓</button>
    </div>
    <!-- 2P: two inputs -->
    <div id="inp-2p" class="hidden">
      <div class="p-box">
        <label id="lp1" style="color:#4488ff">🚀 P1 (Enter)</label>
        <input type="number" id="ap1" placeholder="?" autocomplete="off" inputmode="numeric" readonly/>
      </div>
      <div class="p-box">
        <label id="lp2" style="color:#ff7733">🍠 P2 (Space)</label>
        <input type="number" id="ap2" placeholder="?" autocomplete="off" inputmode="numeric" readonly/>
      </div>
    </div>
    <!-- Mobile numpad (shown on touch devices) -->
    <div id="numpad" class="hidden">
      <button class="np-btn" onclick="npPress(7)">7</button>
      <button class="np-btn" onclick="npPress(8)">8</button>
      <button class="np-btn" onclick="npPress(9)">9</button>
      <button class="np-btn" onclick="npPress(4)">4</button>
      <button class="np-btn" onclick="npPress(5)">5</button>
      <button class="np-btn" onclick="npPress(6)">6</button>
      <button class="np-btn" onclick="npPress(1)">1</button>
      <button class="np-btn" onclick="npPress(2)">2</button>
      <button class="np-btn" onclick="npPress(3)">3</button>
      <button class="np-btn del" onclick="npDel()">⌫</button>
      <button class="np-btn" onclick="npPress(0)">0</button>
      <button class="np-btn confirm" onclick="sub1p()">✓ OK</button>
    </div>
    <div class="hint-2p hidden" id="hint2p">P1: gõ số + Enter &nbsp;|&nbsp; P2: gõ số + Space</div>
    <div id="feedback"></div>
  </div>
</div>

<!-- ═══ WIN ═══ -->
<div id="win-screen" class="hidden">
  <div class="trophy" id="wt">🏆</div>
  <h2 id="wh">Bạn thắng!</h2>
  <p id="wd">...</p>
  <div class="win-btns">
    <button class="win-btn" onclick="restartSame()">Chơi lại 🚀</button>
    <button class="win-btn sec" onclick="goLobby()">Về sảnh</button>
  </div>
</div>

</div><!-- #app -->

<script>
// ── CONFIG ──────────────────────────────────
const TOTAL = 10;
const AV1 = ['🚀','🛸','🌟','⚡','🦅'];
const AV2 = ['🍠','🥔','👾','🤖','🐸'];
const DIFFS = [
  { label:'Dễ',  min:4.0, max:8.0, acc:0.45 },
  { label:'Vừa', min:2.2, max:5.0, acc:0.62 },
  { label:'Khó', min:1.0, max:3.0, acc:0.78 },
];
const rand = a => a[Math.floor(Math.random()*a.length)];

// detect touch
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ── STATE ────────────────────────────────────
let mode='1p', p1n='Bạn', p2n='Khoai Lang', p1av='🚀', p2av='🍠', diff=DIFFS[0];
let pos1=0, pos2=0, sc1=0, sc2=0, qNum=0, curAns=0;
let p1done=false, p2done=false, alive=false;
let tiv=null, aitm=null, afr=null;
let p1b='', p2b='', ops=['+','−'];
let ft=0, sx=0;
let cx1=null, cx2=null, st1=[], st2=[];
let selMode='1p', selDiff=0, selAv1=0, selAv2=0;
let npBuf='';
let timeLeft=10;

// ── COMMENTARY ───────────────────────────────
const aiW = ["bấm máy tính nhưng máy hết pin 🔋","hỏi Google nhưng không có mạng 😭","đoán 2+2=5 rồi xấu hổ 🫣","đang ngủ gật trong buồng lái 💤","nhờ mẹ tính hộ nhưng mẹ đi chợ 🛒","nhìn chằm chằm vào đề bài 😵"];
const aiR = ["may mắn đoán đúng 😅","dùng ngón chân đếm - đúng! 🦶","bí kíp gia truyền phát huy 🍠✨","ngạc nhiên vì chính mình cũng đúng 🤨"];
const urg = ["Nhanh lên! Sắp bị qua mặt rồi! 💨","Còn vài giây!! ⏰","Tập trung nào!! 💪"];
const cor = ["Đúng rồi! Tên lửa tăng tốc! 🔥","Chính xác! Đối thủ hoảng loạn 😱","Xuất sắc! ⚡","Giỏi quá! Đối thủ ngã ngồi 😵"];
const wrg = ["Sai! Tên lửa xịt khói và lùi lại 💨","Đối thủ đang cười bạn kìa 😂","Sai rồi! Cố lên! 💪","Ủa tính toán gì vậy? 🤔"];

// ── LOBBY ────────────────────────────────────
function selectMode(m) {
  selMode = m;
  document.getElementById('card-1p').classList.toggle('active', m==='1p');
  document.getElementById('card-2p').classList.toggle('active', m==='2p');
  renderSetup(m);
}

function renderSetup(m) {
  const el = document.getElementById('setup-area');
  if (m === '1p') {
    el.innerHTML = `
    <div class="setup-section">
      <div class="player-cards">
        <div class="player-card">
          <h4>Tên của bạn</h4>
          <div class="avatar-row">${AV1.map((a,i)=>`<button class="av-btn${i===selAv1?' sel':''}" onclick="pickAv(1,${i},'${a}')">${a}</button>`).join('')}</div>
          <input class="name-input" id="n1" placeholder="Nhập tên..." maxlength="12" value="${p1n==='Bạn'?'':p1n}"/>
        </div>
        <div class="player-card">
          <h4>Đối thủ AI</h4>
          <div class="ai-badge"><span class="big">🍠</span>Khoai Lang<br><span style="font-size:10px">AI ngớ ngẩn nhất vũ trụ</span></div>
        </div>
      </div>
      <div class="diff-label">Độ khó của Khoai Lang</div>
      <div class="diff-row">${DIFFS.map((d,i)=>`<button class="diff-btn${i===selDiff?' sel':''}" onclick="pickDiff(${i})">${d.label}</button>`).join('')}</div>
    </div>`;
  } else {
    el.innerHTML = `
    <div class="setup-section">
      <div class="player-cards">
        <div class="player-card">
          <h4>🚀 Người 1 (Enter)</h4>
          <div class="avatar-row">${AV1.map((a,i)=>`<button class="av-btn${i===selAv1?' sel':''}" onclick="pickAv(1,${i},'${a}')">${a}</button>`).join('')}</div>
          <input class="name-input" id="n1" placeholder="Tên người 1..." maxlength="12" value="${p1n==='Bạn'?'':p1n}"/>
        </div>
        <div class="player-card">
          <h4>🍠 Người 2 (Space)</h4>
          <div class="avatar-row">${AV2.map((a,i)=>`<button class="av-btn${i===selAv2?' sel':''}" onclick="pickAv(2,${i},'${a}')">${a}</button>`).join('')}</div>
          <input class="name-input" id="n2" placeholder="Tên người 2..." maxlength="12" value="${p2n==='Khoai Lang'?'':p2n}"/>
        </div>
      </div>
    </div>`;
  }
}

function pickAv(pl, i, a) {
  if (pl===1) { selAv1=i; p1av=a; } else { selAv2=i; p2av=a; }
  renderSetup(selMode);
}
function pickDiff(i) { selDiff=i; renderSetup(selMode); }

// op toggles
document.querySelectorAll('.op-toggle').forEach(b => {
  b.addEventListener('click', () => {
    const op = b.dataset.op;
    if (ops.includes(op)) { if (ops.length>1) { ops=ops.filter(o=>o!==op); b.classList.remove('on'); } }
    else { ops.push(op); b.classList.add('on'); }
  });
});

function launchGame() {
  mode = selMode; diff = DIFFS[selDiff];
  const n1 = document.getElementById('n1');
  p1n = (n1 && n1.value.trim()) || 'Bạn';
  p1av = AV1[selAv1];
  if (mode === '2p') {
    const n2 = document.getElementById('n2');
    p2n = (n2 && n2.value.trim()) || 'Người 2';
    p2av = AV2[selAv2];
  } else {
    p2n = 'Khoai Lang'; p2av = '🍠';
  }
  startGame();
}

// ── GAME START ────────────────────────────────
function startGame() {
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');

  document.getElementById('tl1').textContent = p1av+' '+p1n;
  document.getElementById('tl2').textContent = p2av+' '+p2n;
  document.getElementById('sb1').textContent = p1av+' '+p1n;
  document.getElementById('sb2').textContent = p2av+' '+p2n;

  if (mode==='1p') {
    document.getElementById('inp-1p').classList.remove('hidden');
    document.getElementById('inp-2p').classList.add('hidden');
    document.getElementById('hint2p').classList.add('hidden');
    if (isTouch) {
      document.getElementById('numpad').classList.remove('hidden');
      document.getElementById('confirm-btn').style.display='none';
      // hide native input on touch (use numpad)
      const inp = document.getElementById('a1p');
      inp.style.pointerEvents='none'; inp.readOnly=true;
    }
  } else {
    document.getElementById('inp-1p').classList.add('hidden');
    document.getElementById('inp-2p').classList.remove('hidden');
    document.getElementById('hint2p').classList.remove('hidden');
    document.getElementById('lp1').textContent = p1av+' '+p1n+' (Enter)';
    document.getElementById('lp2').textContent = p2av+' '+p2n+' (Space)';
  }

  pos1=0; pos2=0; sc1=0; sc2=0; qNum=0; npBuf='';
  updRockets();
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  sx=0; ft=0;

  setTimeout(()=>{
    cx1=initCv('cv1'); st1=mkStars(60,cx1.w,cx1.h);
    cx2=initCv('cv2'); st2=mkStars(60,cx2.w,cx2.h);
    if(afr) cancelAnimationFrame(afr);
    loop();
  },30);
  nextQ();
}

// ── CANVAS ────────────────────────────────────
function mkStars(n,w,h){const a=[];for(let i=0;i<n;i++)a.push({x:Math.random()*w*2,y:Math.random()*h,r:Math.random()*1.3+.3,spd:Math.random()*.8+.2,op:Math.random()*.5+.25});return a;}
function initCv(id){const cv=document.getElementById(id);const w=cv.parentElement.clientWidth||400;const h=cv.parentElement.clientHeight||80;cv.width=w;cv.height=h;return{c:cv.getContext('2d'),w,h};}
function drawTr(ctx,w,h,stars,off){
  const g=ctx.createLinearGradient(0,0,w,0);g.addColorStop(0,'#050510');g.addColorStop(.5,'#0a0a20');g.addColorStop(1,'#050510');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  for(const s of stars){const x=((s.x-off*s.spd)%(w*2)+w*2)%(w*2);if(x>w)continue;ctx.beginPath();ctx.arc(x,s.y,s.r,0,Math.PI*2);ctx.fillStyle=`rgba(255,255,255,${s.op})`;ctx.fill();}
}

// ── ANIM LOOP ─────────────────────────────────
function loop(){
  afr=requestAnimationFrame(loop);
  ft+=.12; sx+=1.2;
  const s=(id,rx,ry)=>{const e=document.getElementById(id);if(e){e.setAttribute('rx',rx.toFixed(1));e.setAttribute('ry',ry.toFixed(1));}};
  s('f1c',6+Math.sin(ft*1.3)*2,3.5+Math.sin(ft)*1.2);
  s('f1h',3.5+Math.sin(ft)*1.2,2+Math.sin(ft*1.6)*.8);
  s('f2c',8+Math.sin(ft*1.1)*2.5,5+Math.sin(ft*.9)*2);
  s('f2h',5+Math.sin(ft)*2,3+Math.sin(ft*1.4)*1.2);
  if(cx1)drawTr(cx1.c,cx1.w,cx1.h,st1,sx);
  if(cx2)drawTr(cx2.c,cx2.w,cx2.h,st2,sx);
}

// ── POSITION ──────────────────────────────────
function posToLeft(p){return(2+(Math.max(-.3,Math.min(TOTAL,p))/TOTAL)*80).toFixed(1)+'%';}
function updRockets(){document.getElementById('rc1').style.left=posToLeft(pos1);document.getElementById('rc2').style.left=posToLeft(pos2);}

// ── PARTICLES ─────────────────────────────────
function smoke(tid,rid){const t=document.getElementById(tid),r=document.getElementById(rid),lp=parseFloat(r.style.left)||2;for(let i=0;i<5;i++){const el=document.createElement('div');el.className='smoke';const sz=6+Math.random()*8,dy=(-10+Math.random()*20).toFixed(0)+'px';el.style.cssText=`width:${sz}px;height:${sz}px;background:rgba(180,180,180,.55);left:calc(${lp}% + ${Math.random()*5}px);top:${28+Math.random()*18}px;--dy:${dy};animation-delay:${i*.06}s`;t.appendChild(el);setTimeout(()=>el.remove(),900);}}
function boost(tid,rid){const t=document.getElementById(tid),r=document.getElementById(rid),lp=parseFloat(r.style.left)||2;const el=document.createElement('div');el.className='boost';el.style.cssText=`width:48px;height:48px;left:calc(${lp}% + 34px);top:50%`;t.appendChild(el);setTimeout(()=>el.remove(),550);}

// ── QUESTION ──────────────────────────────────
function genQ(){
  const op=ops[Math.floor(Math.random()*ops.length)];
  let a,b,ans;
  if(op==='+'){a=~~(Math.random()*30)+1;b=~~(Math.random()*30)+1;ans=a+b;return{q:`${a} + ${b} = ?`,ans};}
  if(op==='−'){a=~~(Math.random()*40)+5;b=~~(Math.random()*(a-1))+1;ans=a-b;return{q:`${a} − ${b} = ?`,ans};}
  if(op==='×'){a=~~(Math.random()*9)+1;b=~~(Math.random()*9)+1;ans=a*b;return{q:`${a} × ${b} = ?`,ans};}
  b=~~(Math.random()*9)+1;ans=~~(Math.random()*9)+1;a=b*ans;return{q:`${a} ÷ ${b} = ?`,ans};
}

// ── TIMER ─────────────────────────────────────
function startTimer(){
  timeLeft=10;const bar=document.getElementById('timer-bar');
  bar.style.width='100%';bar.style.background='#4488ff';
  clearInterval(tiv);
  tiv=setInterval(()=>{
    timeLeft-=.1;const pct=Math.max(0,(timeLeft/10)*100);
    bar.style.width=pct+'%';
    if(pct<30)bar.style.background='#ee4444';
    else if(pct<60)bar.style.background='#ffaa22';
    else bar.style.background='#4488ff';
    if(timeLeft<=3&&timeLeft>2.9)com(rand(urg));
    if(timeLeft<=0){
      clearInterval(tiv);
      if(mode==='1p'&&!p1done)p1wrong(true);
      if(mode==='2p'){if(!p1done)scoreP(1,false);if(!p2done)scoreP(2,false);setTimeout(nextQ,1200);}
    }
  },100);
}

// ── AI ────────────────────────────────────────
function startAI(){
  const t=(diff.min+Math.random()*(diff.max-diff.min))*1000;
  const right=Math.random()<diff.acc;
  aitm=setTimeout(()=>{
    if(!alive)return;
    p2done=true;
    if(right){
      pos2=Math.min(TOTAL,pos2+1);sc2++;
      document.getElementById('s2').textContent=sc2;
      updRockets();boost('tr2','rc2');
      if(!p1done)com(`${p2av} ${p2n} ${rand(aiR)}`);
      if(pos2>=TOTAL){clrT();setTimeout(endGame,600);}
    } else {
      pos2=Math.max(-.3,pos2-1);updRockets();smoke('tr2','rc2');
      if(!p1done)com(`${p2av} ${p2n} ${rand(aiW)}`);
    }
  },t);
}

function clrT(){clearInterval(tiv);clearTimeout(aitm);alive=false;}

// ── P1 SUBMIT ─────────────────────────────────
function sub1p(){
  if(p1done||!alive)return;
  const val=mode==='1p'? (isTouch ? parseInt(npBuf) : parseInt(document.getElementById('a1p').value))
                       : parseInt(p1b);
  if(isNaN(val))return;
  p1done=true;
  if(mode==='1p'){
    const inp=document.getElementById('a1p');
    inp.className=val===curAns?'ok':'bad'; inp.disabled=true;
  }
  if(val===curAns)p1correct();else p1wrong(false);
}

function p1correct(){
  pos1=Math.min(TOTAL,pos1+1);sc1++;
  document.getElementById('s1').textContent=sc1;
  updRockets();boost('tr1','rc1');
  fb(rand(cor),'#33bb66');
  npBuf=''; if(isTouch)document.getElementById('a1p').value='';
  if(pos1>=TOTAL){clrT();setTimeout(endGame,600);return;}
  setTimeout(nextQ,1300);
}
function p1wrong(timeout){
  pos1=Math.max(-.3,pos1-1);updRockets();smoke('tr1','rc1');
  if(mode==='1p'){const inp=document.getElementById('a1p');inp.className='bad';inp.disabled=true;}
  npBuf=''; if(isTouch)document.getElementById('a1p').value='';
  fb(timeout?`⏰ Hết giờ! ${p2av} ${p2n} cười ngặt nghẽo 😂`:rand(wrg),'#ee4444');
  setTimeout(nextQ,1400);
}

// ── NUMPAD ────────────────────────────────────
function npPress(d){
  if(!alive||p1done)return;
  npBuf+=d; document.getElementById('a1p').value=npBuf;
}
function npDel(){
  if(!alive||p1done)return;
  npBuf=npBuf.slice(0,-1); document.getElementById('a1p').value=npBuf;
}

// ── 2P KEYBOARD ───────────────────────────────
document.addEventListener('keydown',e=>{
  if(document.getElementById('game-screen').classList.contains('hidden'))return;
  if(mode!=='2p'||!alive)return;
  const k=e.key;
  if(k===' '){e.preventDefault();if(!p2done&&p2b){const v=parseInt(p2b);document.getElementById('ap2').value=p2b;p2b='';scoreP(2,v===curAns);}return;}
  if(k==='Enter'){e.preventDefault();if(!p1done&&p1b){const v=parseInt(p1b);document.getElementById('ap1').value=p1b;p1b='';scoreP(1,v===curAns);}return;}
  if(k==='Backspace'){if(!p1done){p1b=p1b.slice(0,-1);document.getElementById('ap1').value=p1b;}if(!p2done){p2b=p2b.slice(0,-1);document.getElementById('ap2').value=p2b;}return;}
  if(k>='0'&&k<='9'){if(!p1done){p1b+=k;document.getElementById('ap1').value=p1b;}if(!p2done){p2b+=k;document.getElementById('ap2').value=p2b;}}
});

function scoreP(pl,correct){
  if(pl===1)p1done=true;else p2done=true;
  const iid=pl===1?'ap1':'ap2',tid=pl===1?'tr1':'tr2',rid=pl===1?'rc1':'rc2';
  document.getElementById(iid).className=correct?'ok':'bad';
  if(correct){
    if(pl===1){pos1=Math.min(TOTAL,pos1+1);sc1++;document.getElementById('s1').textContent=sc1;}
    else{pos2=Math.min(TOTAL,pos2+1);sc2++;document.getElementById('s2').textContent=sc2;}
    updRockets();boost(tid,rid);
  } else {
    if(pl===1)pos1=Math.max(-.3,pos1-1);else pos2=Math.max(-.3,pos2-1);
    updRockets();smoke(tid,rid);
  }
  p1b='';p2b='';
  if(pos1>=TOTAL||pos2>=TOTAL){clrT();setTimeout(endGame,600);return;}
  if(p1done&&p2done)setTimeout(nextQ,1200);
}

// ── NEXT Q ────────────────────────────────────
function nextQ(){
  if(qNum>=TOTAL){endGame();return;}
  clearInterval(tiv);clearTimeout(aitm);
  alive=true;p1done=false;p2done=false;p1b='';p2b='';npBuf='';
  qNum++;
  const{q,ans}=genQ();curAns=ans;
  document.getElementById('q-text').textContent=q;
  document.getElementById('qn').textContent=qNum+'/'+TOTAL;
  document.getElementById('feedback').textContent='';
  com('⏱️ Ai nhanh hơn?');
  if(mode==='1p'){
    const inp=document.getElementById('a1p');
    inp.value='';inp.className='';inp.disabled=false;
    if(!isTouch)inp.focus();
    startAI();
  } else {
    ['ap1','ap2'].forEach(id=>{const e=document.getElementById(id);e.value='';e.className='';});
  }
  startTimer();
}

// ── END ───────────────────────────────────────
function endGame(){
  clrT();
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('win-screen').classList.remove('hidden');
  const t=document.getElementById('wt'),h=document.getElementById('wh'),d=document.getElementById('wd');
  if(pos1>pos2){
    t.textContent='🏆';
    h.textContent=`${p1av} ${p1n} thắng!`;
    d.textContent=mode==='1p'
      ?`${p2av} Khoai Lang thất bại thảm hại!\nBị phóng ra ngoài thiên hà 🍠💫\n\n${p1n}: ${sc1} đúng  ·  Khoai Lang: ${sc2} đúng`
      :`${p1n}: ${sc1} đúng  ·  ${p2n}: ${sc2} đúng`;
  } else if(pos2>pos1){
    t.textContent=mode==='1p'?'🍠':'🏆';
    h.textContent=mode==='1p'?`🍠 Khoai Lang thắng?! Không thể tin được!`:`${p2av} ${p2n} thắng!`;
    d.textContent=mode==='1p'
      ?`Khoai Lang: ${sc2} đúng  ·  ${p1n}: ${sc1} đúng\nChơi lại để rửa hận! 💪`
      :`${p1n}: ${sc1} đúng  ·  ${p2n}: ${sc2} đúng`;
  } else {
    t.textContent='🤝';
    h.textContent='Hòa nhau rồi!';
    d.textContent=`Cùng ${sc1} câu đúng!\nCân tài cân sức ghê 🎯`;
  }
}

function restartSame(){
  document.getElementById('win-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  pos1=0;pos2=0;sc1=0;sc2=0;qNum=0;npBuf='';
  updRockets();
  document.getElementById('s1').textContent='0';
  document.getElementById('s2').textContent='0';
  sx=0;ft=0;
  if(afr)cancelAnimationFrame(afr);
  setTimeout(()=>{
    cx1=initCv('cv1');st1=mkStars(60,cx1.w,cx1.h);
    cx2=initCv('cv2');st2=mkStars(60,cx2.w,cx2.h);
    loop();
  },30);
  nextQ();
}

function goLobby(){
  clrT();if(afr){cancelAnimationFrame(afr);afr=null;}
  document.getElementById('win-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.add('hidden');
  document.getElementById('lobby').classList.remove('hidden');
}

function com(s){document.getElementById('commentary').textContent=s;}
function fb(s,c){const e=document.getElementById('feedback');e.textContent=s;e.style.color=c;}

// ── INIT ──────────────────────────────────────
selectMode('1p');
document.getElementById('submit-1p') && (document.getElementById('submit-1p').onclick=sub1p);
document.getElementById('a1p').addEventListener('keydown',e=>{if(e.key==='Enter')sub1p();});
</script>
</body>
</html>
